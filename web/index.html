<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warszawa Voxel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%225%22 y=%222%22 width=%226%22 height=%2214%22 fill=%22%23c6ae7f%22/%3E%3Crect x=%227%22 y=%220%22 width=%222%22 height=%223%22 fill=%22%23f2c200%22/%3E%3Crect x=%222%22 y=%229%22 width=%2212%22 height=%227%22 fill=%22%23b39a6b%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>
  <div id="loading"><div class="spinner"></div><div id="loading-text">Loading…</div></div>
  <header id="title">
    <h1>Warszawa <em>Śródmieście</em></h1>
    <p id="stats">—</p>
  </header>
  <nav id="panel">
    <div class="row presets">
      <button data-preset="golden" class="on">Golden hour</button>
      <button data-preset="midday">Midday</button>
      <button data-preset="night">Night</button>
    </div>
    <div class="row slider"><input id="hour" type="range" min="4.5" max="23.5" step="0.05" value="19" /><span id="hour-label">19:00</span></div>
    <div class="row views" id="views"></div>
    <div class="row toggles">
      <label><input type="checkbox" id="t-labels" checked /> Labels</label>
      <label><input type="checkbox" id="t-tilt" checked /> Tilt-shift</label>
      <label><input type="checkbox" id="t-trams" checked /> Trams</label>
    </div>
    <div class="row hint">Drag to orbit · right-drag to pan · scroll zooms to cursor · <b>WASD</b>/arrows move · <b>Q/E</b> down/up · <b>Shift</b> fast
    </div>
  </nav>
  <footer id="sources"></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
